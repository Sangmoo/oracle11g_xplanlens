[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "xplanlens"
version = "0.1.0"
description = "Oracle 11gR2 DBMS_XPLAN execution plan analyzer and visualizer"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Sangmoo" }]
keywords = ["oracle", "11g", "dbms_xplan", "execution plan", "sql tuning"]
dependencies = []

[project.optional-dependencies]
llm = ["anthropic>=1.0", "openai>=1.0"]
app = ["gradio>=5.0,<6", "markdown-it-py>=3.0", "anthropic>=1.0", "openai>=1.0"]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
xplanlens = ["samples/*.txt"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
